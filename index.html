<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マイチョイス</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2f3f5; --surface:#ffffff; --text:#16181c; --text-sub:#6b7280;
    --border:#e2e4e8; --accent:#1a56db; --accent-hover:#154cc4;
    --price:#c1272d; --good:#1a7f37; --bad:#9aa0a6;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#101216; --surface:#1a1d23; --text:#e8e9eb; --text-sub:#9aa0a6;
      --border:#2b2f38; --accent:#5b9dff; --accent-hover:#7cb0ff;
      --price:#ff6b6b; --good:#4ade80; --bad:#6b7280;
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Hiragino Sans","Yu Gothic",system-ui,-apple-system,sans-serif;
  }
  a{color:inherit;}

  .topbar{background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10;}
  .topbar-inner{
    max-width:1080px; margin:0 auto; padding:12px 16px;
    display:flex; align-items:center; gap:20px;
  }
  .brand{font-size:1rem; font-weight:800; letter-spacing:.02em; text-decoration:none; white-space:nowrap;}
  .searchbox{flex:1; max-width:460px; display:flex; align-items:center; gap:8px;}
  .searchbox input{
    flex:1; min-width:0; padding:8px 12px; font-size:.88rem;
    border:1px solid var(--border); border-radius:4px;
    background:var(--bg); color:var(--text);
  }
  .searchbox input:focus{outline:none; border-color:var(--accent);}
  .searchbox input::placeholder{color:var(--text-sub);}

  /* 検索ボタン：ガラス風の丸いピル型ボタン。ホバーで光の筋が流れ、クリックで波紋、
     検索中はスピナー＋紫の光、完了すると緑のチェック＋「完了」に切り替わる（参考コードを移植） */
  .search-btn{
    position:relative; display:inline-flex; align-items:center; justify-content:center;
    gap:8px; padding:9px 20px; border-radius:9999px;
    background:rgba(18,24,38,.85); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.15);
    color:#fff; font-size:.85rem; font-weight:600; white-space:nowrap; cursor:pointer;
    overflow:hidden;
    transition:transform .3s ease, border-color .3s ease, box-shadow .3s ease;
    box-shadow:0 4px 20px rgba(0,0,0,.4);
  }
  .search-btn:hover{
    transform:translateY(-2px) scale(1.02);
    border-color:rgba(99,102,241,.8);
    box-shadow:0 8px 25px rgba(99,102,241,.35);
  }
  .search-btn:disabled{ cursor:default; }
  .search-btn::before{
    content:""; position:absolute; top:0; left:-100%; width:100%; height:100%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.2), transparent);
    transform:skewX(-20deg);
  }
  .search-btn:hover::before{ animation:btn-shimmer 1.2s infinite; }
  @keyframes btn-shimmer{ 0%{ left:-100%; } 100%{ left:200%; } }

  .btn-ripple{
    position:absolute; border-radius:50%; background:rgba(255,255,255,.3);
    transform:scale(0); animation:btn-ripple-effect .6s linear; pointer-events:none;
  }
  @keyframes btn-ripple-effect{ to{ transform:scale(4); opacity:0; } }

  .search-btn.is-searching{
    border-color:rgba(168,85,247,.8); box-shadow:0 0 20px rgba(168,85,247,.4); cursor:default;
  }
  .search-btn.is-success{
    border-color:rgba(16,185,129,.8); box-shadow:0 0 20px rgba(16,185,129,.4); color:#34d399;
  }

  .btn-icon-wrap{ display:flex; align-items:center; justify-content:center; width:16px; height:16px; }
  .btn-icon{ display:none; width:16px; height:16px; }
  .search-btn .icon-search{ display:inline-block; }
  .search-btn.is-searching .icon-search{ display:none; }
  .search-btn.is-searching .icon-spinner{ display:inline-block; animation:btn-spin .8s linear infinite; color:#c4b5fd; }
  @keyframes btn-spin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
  .search-btn.is-success .icon-search,
  .search-btn.is-success .icon-spinner{ display:none; }
  .search-btn.is-success .icon-check{ display:inline-block; animation:btn-pop-in .3s ease; }
  @keyframes btn-pop-in{ 0%{ transform:scale(0); } 100%{ transform:scale(1); } }

  /* 検索前は Google のトップページのように、タイトルと検索窓を画面中央に大きく表示する */
  body.home .topbar{
    position:static; background:transparent; border-bottom:none;
    min-height:64vh; display:flex; align-items:center; justify-content:center;
  }
  body.home .topbar-inner{
    flex-direction:column; gap:22px; max-width:520px; width:100%; padding:16px;
  }
  body.home .brand{font-size:2rem;}
  body.home .searchbox{max-width:100%; width:100%;}
  body.home .layout{display:none;}

  .layout{
    max-width:1080px; margin:0 auto; padding:20px 16px 60px;
    display:flex; align-items:flex-start; gap:28px;
  }
  .sidebar{width:200px; flex-shrink:0;}
  @media (max-width:800px){
    .layout{flex-direction:column; gap:16px;}
    .sidebar{width:100%;}
  }

  .sidebar h2{
    font-size:.82rem; font-weight:700; margin:0 0 8px; padding-bottom:6px;
    border-bottom:1px solid var(--border);
  }
  .filter-list{display:flex; flex-direction:column; gap:1px; font-size:.83rem;}
  .filter-item{display:flex; align-items:center; gap:7px; padding:5px 2px; cursor:pointer;}
  .filter-item input{width:14px; height:14px; accent-color:var(--accent); flex-shrink:0;}
  .empty-note{color:var(--text-sub); font-size:.8rem; margin:0;}

  .main{flex:1; min-width:0;}
  .status{font-size:.8rem; color:var(--text-sub); min-height:1.2em; margin:0;}
  .status.err{color:#c0392b;}

  .progress-wrap{
    width:100%; height:3px; background:var(--border); overflow:hidden;
    margin:6px 0 4px; display:none;
  }
  .progress-bar{height:100%; width:0%; background:var(--accent); transition:width .25s ease;}

  .result-bar{
    display:flex; justify-content:space-between; align-items:center;
    padding-bottom:8px; margin-bottom:6px; border-bottom:1px solid var(--border);
    font-size:.8rem;
  }
  .result-count{color:var(--text-sub);}
  select{
    padding:5px 8px; border:1px solid var(--border); border-radius:4px;
    background:var(--surface); color:var(--text); font-size:.8rem;
  }

  .product-list{list-style:none; margin:0; padding:0;}
  .product-row{display:flex; gap:12px; padding:14px 2px; border-bottom:1px solid var(--border);}

  .p-thumb{
    flex-shrink:0; width:104px; height:104px; display:block; overflow:hidden;
    border:1px solid var(--border); border-radius:4px; background:var(--surface);
  }
  .p-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .p-thumb.empty{
    display:flex; align-items:center; justify-content:center; text-align:center;
    color:var(--text-sub); font-size:.68rem; padding:6px;
  }
  @media (max-width:520px){ .p-thumb{width:76px; height:76px;} }

  .p-info{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;}
  .p-name{font-size:.88rem; font-weight:600; line-height:1.4;}
  .p-name a{text-decoration:none;}
  .p-name a:hover{color:var(--accent); text-decoration:underline;}
  .p-meta{font-size:.76rem; color:var(--text-sub);}
  .p-meta .origin{font-weight:700; color:var(--text); margin-right:8px;}
  .p-feature{font-size:.76rem; color:var(--text-sub);}
  .p-specs{font-size:.76rem; color:var(--text-sub);}
  .p-specs span{margin-right:12px; white-space:nowrap;}
  .p-specs b{color:var(--text); font-weight:600;}
  .p-attrs{font-size:.74rem; margin-top:2px;}
  .p-attrs span{margin-right:10px; white-space:nowrap;}
  .p-attrs .hit{color:var(--good);}
  .p-attrs .miss{color:var(--bad);}
  .p-shop{font-size:.72rem; color:var(--text-sub); margin-top:2px;}
  .p-mall{
    display:inline-block; font-size:.66rem; font-weight:700; color:var(--accent);
    border:1px solid var(--accent); border-radius:3px; padding:0 4px; margin-right:2px;
  }

  .p-side{
    flex-shrink:0; width:118px; text-align:right;
    display:flex; flex-direction:column; align-items:flex-end; gap:2px;
  }
  .p-price{font-size:1.05rem; font-weight:800; color:var(--price); white-space:nowrap;}
  .p-qty{font-size:.76rem; color:var(--text); font-weight:600; white-space:nowrap;}
  .p-perunit{font-size:.7rem; color:var(--text-sub);}
  .p-shipping{font-size:.7rem; color:var(--text-sub);}
  .p-shipping.free{color:var(--good); font-weight:600;}
  .p-rating{font-size:.76rem; margin-top:4px; white-space:nowrap;}
  .p-rating .count{color:var(--text-sub); font-weight:400;}
  @media (max-width:520px){ .p-side{width:90px;} .p-price{font-size:.92rem;} }

  .badge-cheapest{
    display:inline-block; font-size:.68rem; font-weight:700; color:#fff;
    background:var(--price); border-radius:3px; padding:2px 6px; margin-bottom:3px;
  }

  .buying-guide{
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:14px 16px; margin-bottom:14px;
  }
  .bg-heading{font-size:.85rem; font-weight:700; margin:0 0 8px;}
  .bg-tip{
    font-size:.8rem; background:var(--bg); border-radius:6px; padding:8px 10px;
    margin:0 0 10px; line-height:1.5;
  }
  .bg-columns{display:flex; gap:20px; flex-wrap:wrap;}
  .bg-col{flex:1; min-width:200px;}
  .bg-col h3{font-size:.76rem; color:var(--text-sub); margin:0 0 6px; font-weight:700;}
  .bg-col ul{margin:0; padding-left:1.1em; font-size:.78rem; line-height:1.6;}
  .bg-col dl{margin:0; font-size:.78rem; line-height:1.5;}
  .bg-col dt{font-weight:700; margin-top:6px;}
  .bg-col dt:first-child{margin-top:0;}
  .bg-col dd{margin:0 0 2px; color:var(--text-sub);}

  .exclude-list{margin-top:14px; padding-top:10px; border-top:1px solid var(--border);}
  .exclude-list .filter-item input{accent-color:var(--price);}

  /* ===== 検索中のアニメーション：高級腕時計風のゴールドの針時計。検索中はくるくる回り、
     結果が揃った瞬間に12:00でピタッと止まる ===== */
  .loading-scene{
    display:flex; justify-content:center; align-items:center;
    padding:20px 0 10px;
  }
  .clock-canvas{
    position:relative;
    width:100%; max-width:260px; aspect-ratio:800/882;
    background:radial-gradient(ellipse at 50% 42%, #14161c 0%, #050608 80%);
    border-radius:18px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  .clock-svg{ width:100%; height:100%; display:block; }

  .clock-numeral{ font-family:'Playfair Display',Georgia,serif; font-weight:700; }
  .clock-tick-major{ stroke:#d4af37; }
  .clock-tick-minor{ stroke:rgba(212,175,55,.3); }

  /* 針は元データの描画角度ぶんだけ補正した上で、現在時刻に合わせてJSで毎秒回転させる */
  #hour-hand-group, #minute-hand-group, #second-hand-group{
    transform-box:view-box; transform-origin:400px 430px;
  }
  #second-hand-group{ transition:transform .12s linear; }
</style>
</head>
<body class="home">
<header class="topbar">
  <div class="topbar-inner">
    <span class="brand">マイチョイス</span>
    <div class="searchbox">

          <svg class="btn-icon icon-spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="9" stroke-dasharray="42 14"/></svg>
          <svg class="btn-icon icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
        </span>
        <span id="btnText">検索</span>

  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <h2>絞り込み</h2>
    <div class="filter-list" id="prefsContainer"><p class="empty-note">検索すると表示されます</p></div>
    <div class="exclude-list" id="excludeContainer"></div>
  </aside>

  <main class="main">
    <p class="status" id="status"></p>
    <div class="progress-wrap" id="progressWrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="loading-scene" id="loadingScene" style="display:none;">
      <div class="clock-canvas">
        <svg class="clock-svg" id="clockSvg" viewBox="0 0 800 882" fill="none" role="img" aria-label="検索中の時計">
          <g id="dial-face">
            <circle cx="400" cy="430" r="380" fill="url(#dialBgGradient)" stroke="#2a2415" stroke-width="3"/>
            <circle cx="400" cy="430" r="365" stroke="url(#goldRimGradient)" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.6"/>
            <text class="clock-numeral" x="400" y="145" text-anchor="middle" dominant-baseline="middle" fill="#fef08a" font-size="42" letter-spacing="2">XII</text>
            <text class="clock-numeral" x="690" y="435" text-anchor="middle" dominant-baseline="middle" fill="#fef08a" font-size="42">III</text>
            <text class="clock-numeral" x="400" y="725" text-anchor="middle" dominant-baseline="middle" fill="#fef08a" font-size="42">VI</text>
            <text class="clock-numeral" x="110" y="435" text-anchor="middle" dominant-baseline="middle" fill="#fef08a" font-size="42">IX</text>
          </g>

          <!-- 60分の目盛り（JSで生成） -->
          <g id="ticks-container"></g>

          <mask id="mask0_256_20810" style="mask-type:alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="800" height="883">
            <path d="M0 0H800V882H0V0Z" fill="#D9D9D9"></path>
          </mask>

          <g mask="url(#mask0_256_20810)">

              <path d="M401.817 437.507L397.326 437.572L388.545 370.113L397.647 305.35L409.279 366.793L401.817 437.507Z" fill="url(#paint4_linear_256_20810)"></path>
              <path d="M396.974 437.98L396.928 437.624L388.14 370.11L388.146 370.056L397.589 302.875L409.685 366.775L402.179 437.903L396.974 437.98ZM388.951 370.115L397.679 437.164L401.455 437.109L408.873 366.808L397.707 307.824L388.951 370.115Z" fill="url(#paint5_linear_256_20810)"></path>

              <path d="M198.255 482.572L198.048 481.799L277.224 452.309L405.091 424.16L406.45 429.243L281.937 468.541L198.255 482.572ZM404.512 425.112L277.45 453.079L202.277 481.082L281.749 467.761L405.473 428.707L404.512 425.112Z" fill="url(#paint3_linear_256_20810)"></path>

          <defs>

              <stop stop-color="#FFF7B4"></stop>
              <stop offset="0.8876" stop-color="#825022"></stop>

              <stop stop-color="#FFF7B4"></stop>
              <stop offset="0.8876" stop-color="#825022"></stop>
            </linearGradient>
            <linearGradient id="paint3_linear_256_20810" x1="-0.608124" y1="719.879" x2="916.169" y2="-80.3583" gradientUnits="userSpaceOnUse">

              <stop offset="0.8876" stop-color="#825022"></stop>

              <stop offset="0%" stop-color="#161922"/>

      </div>
    </div>

    <div id="resultPanel" style="display:none;">
      <div class="buying-guide" id="buyingGuidePanel" style="display:none;"></div>
      <div class="result-bar">
        <span class="result-count" id="resultCount"></span>
        <select id="sortSelect">
          <option value="score">おすすめ順</option>
          <option value="price">値段順</option>
          <option value="perunit">単価が安い順</option>

        </select>
      </div>
      <ul class="product-list" id="cards"></ul>
    </div>
  </main>
</div>

<script>
// ▼ このページを github.io で公開して開いたときだけ、楽天側のリファラーチェックを通過します。
//   ローカルでダブルクリックして開いただけでは実データは取得できません（HTTP_REFERRER_MISSING 等のエラーになります）。
const statusEl = document.getElementById("status");
const resultPanel = document.getElementById("resultPanel");
const cardsEl = document.getElementById("cards");
const resultCountEl = document.getElementById("resultCount");
const goBtn = document.getElementById("go");
const btnTextEl = document.getElementById("btnText");

// クリックした位置から波紋（リップル）を広げる演出（検索の成否には関係ない見た目だけの効果）
goBtn.addEventListener("click", (e) => {
  const rect = goBtn.getBoundingClientRect();
  const diameter = Math.max(rect.width, rect.height);
  const circle = document.createElement("span");
  circle.style.width = circle.style.height = `${diameter}px`;
  circle.style.left = `${e.clientX - rect.left - diameter / 2}px`;
  circle.style.top = `${e.clientY - rect.top - diameter / 2}px`;
  circle.classList.add("btn-ripple");
  const existing = goBtn.querySelector(".btn-ripple");
  if(existing) existing.remove();
  goBtn.appendChild(circle);
});

// 検索ボタンの状態表示（検索中スピナー／完了チェック）を切り替える
let btnResetTimer = null;
function setButtonSearching(){
  clearTimeout(btnResetTimer);
  goBtn.classList.remove("is-success");
  goBtn.classList.add("is-searching");
  btnTextEl.textContent = "検索中...";
}
function setButtonSuccess(){
  goBtn.classList.remove("is-searching");
  goBtn.classList.add("is-success");
  btnTextEl.textContent = "完了";
  btnResetTimer = setTimeout(setButtonIdle, 1200);
}
function setButtonIdle(){
  clearTimeout(btnResetTimer);
  goBtn.classList.remove("is-searching", "is-success");
  btnTextEl.textContent = "検索";
}
const prefsContainer = document.getElementById("prefsContainer");
const excludeContainer = document.getElementById("excludeContainer");
const sortSelect = document.getElementById("sortSelect");
const progressWrap = document.getElementById("progressWrap");
const progressBar = document.getElementById("progressBar");

// ===== 進捗バー（検索〜AI分析は正確な進捗が分からないため、それらしく進んでいるように見せる擬似的なもの） =====
let progressTimer = null;
function startProgress(){
  clearInterval(progressTimer);
  progressBar.style.width = "0%";
  progressWrap.style.display = "block";
  let pct = 0;
  progressTimer = setInterval(() => {
    // 90%までは徐々に近づけ、実際に終わるまで100%にはしない（応答待ちであることが分かるように）
    pct += (90 - pct) * 0.12 + 0.5;
    if(pct > 90) pct = 90;
    progressBar.style.width = pct.toFixed(1) + "%";
  }, 200);
}
function finishProgress(){
  clearInterval(progressTimer);
  progressBar.style.width = "100%";
  setTimeout(() => {
    progressWrap.style.display = "none";
    progressBar.style.width = "0%";
  }, 350);
}

// 時計の針を現在時刻に合わせて動かす（各針の描画角度ぶんの補正 + 実際の時刻分の回転）
const CLOCK_BASE_OFFSET = { hour: 1.08, minute: 104.5, second: -139.63 };
const hourHandGroup = document.getElementById("hour-hand-group");
const minuteHandGroup = document.getElementById("minute-hand-group");
const secondHandGroup = document.getElementById("second-hand-group");
function updateClockHands(){
  const now = new Date();
  const h = now.getHours() % 12;
  const m = now.getMinutes();
  const s = now.getSeconds();
  const secAngle = s * 6;
  const minAngle = m * 6 + s * 0.1;
  const hourAngle = h * 30 + m * 0.5;
  if(hourHandGroup) hourHandGroup.style.transform = `rotate(${CLOCK_BASE_OFFSET.hour + hourAngle}deg)`;
  if(minuteHandGroup) minuteHandGroup.style.transform = `rotate(${CLOCK_BASE_OFFSET.minute + minAngle}deg)`;
  if(secondHandGroup) secondHandGroup.style.transform = `rotate(${CLOCK_BASE_OFFSET.second + secAngle}deg)`;
}
updateClockHands();
setInterval(updateClockHands, 1000);

// 時計の文字盤に60分の目盛りを描く（中心(400,430)・半径360、5分ごとは太く金色、それ以外は細く控えめに）
(function generateClockTicks(){
  const container = document.getElementById("ticks-container");
  if(!container) return;
  const CX = 400, CY = 430, radius = 360;
  let html = "";
  for(let i = 0; i < 60; i++){
    const angleDeg = i * 6;
    const angleRad = (angleDeg - 90) * (Math.PI / 180);
    const isHourTick = i % 5 === 0;
    const tickLength = isHourTick ? 16 : 8;
    const strokeWidth = isHourTick ? 3 : 1;
    const cls = isHourTick ? "clock-tick-major" : "clock-tick-minor";
    const x1 = CX + Math.cos(angleRad) * (radius - tickLength);
    const y1 = CY + Math.sin(angleRad) * (radius - tickLength);
    const x2 = CX + Math.cos(angleRad) * radius;
    const y2 = CY + Math.sin(angleRad) * radius;
    html += `<line class="${cls}" x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}" stroke-width="${strokeWidth}" stroke-linecap="round"/>`;
  }
  container.innerHTML = html;
})();

// ===== 自分のサーバー（中継API）への問い合わせ =====
async function apiRequest(endpoint, params){
  const qs = new URLSearchParams(params);
  const r = await fetch(`${endpoint}?${qs.toString()}`);
  const data = await r.json();
  if(!r.ok){
    const msg = data?.errors?.errorMessage || data?.error || `HTTP ${r.status}`;
    throw new Error(msg);
  }
  return data;
}

// Yahoo!ショッピングAPI(v3)のhitsを、楽天のItem形式に合わせた共通の形に変換する。
// こうすることで、buildRows以下の処理を楽天・Yahoo!で共通のまま使い回せる。
function yahooHitToItem(hit){
  const image = hit.image || {};
  return {
    itemName: hit.name || "",
    itemCaption: hit.description || hit.headLine || "",
    itemPrice: hit.price || 0,
    itemUrl: hit.url || "",
    shopName: (hit.seller && hit.seller.name) || "Yahoo!ショッピング",
    mediumImageUrls: image.medium ? [{ imageUrl: image.medium }] : (image.small ? [{ imageUrl: image.small }] : []),
    // 楽天のpostageFlag（0:送料無料 / 1:送料別）に合わせる。Yahoo!のshipping.codeの正確な対応表が
    // 無いため、名前に「無料」と入っているときだけ送料無料とみなす簡易判定にしている。
    postageFlag: (hit.shipping && /無料/.test(hit.shipping.name || "")) ? 0 : 1,
    reviewAverage: (hit.review && hit.review.rate) || 0,
    reviewCount: (hit.review && hit.review.count) || 0,
    _mall: "Yahoo!",
  };
}

async function analyzeWithAI(keyword, itemsForAI){
  const r = await fetch("/api/analyze", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ keyword, items: itemsForAI }),
  });
  const data = await r.json();
  if(!r.ok){
    const detail = data?.raw ? ` / ${data.raw.slice(0, 200)}` : "";
    throw new Error(`${data?.error || "error"} (HTTP ${data?.status || r.status})${detail}`);
  }
  return data; // { attributes: [{id,label}], specFields: [{id,label}], items: [{index, relevant, attrHits, specs:[{id,value}], origin, maker, feature, quantityValue, quantityUnit}] }
}

// （絞り込み項目としてではなく、実際に検索結果に混ざっているときだけ excludeContainer に表示する。renderExcludePanel参照）
const FALLBACK_GENRE_MAP = [
  { match: ["梅シロップ", "梅干し", "梅酒", "梅"], attrs: ["additive", "domestic", "handmade"] },
  { match: ["はちみつ", "蜂蜜", "ハチミツ"], attrs: ["additive", "domestic", "organic"] },

  { match: ["チョコ", "カカオ", "ショコラ"], attrs: ["fairtrade", "organic", "handmade"] },
  { match: ["米", "お米", "野菜", "果物", "フルーツ"], attrs: ["domestic", "organic"] },
  { match: ["醤油", "味噌", "みそ", "塩", "砂糖", "調味料"], attrs: ["additive", "domestic"] },
];
const FALLBACK_DEFAULT_ATTRS = ["additive", "domestic"];

// 産地（都道府県）を表示するのは食品・飲料ジャンルのときだけにするための簡易判定
const FOOD_KEYWORDS = FALLBACK_GENRE_MAP.flatMap(g => g.match).concat([
  "食品", "食材", "フード", "お菓子", "菓子", "スイーツ", "飲料", "ドリンク", "飲み物",
  "酒", "肉", "魚", "海鮮", "野菜", "果物", "フルーツ", "パン", "麺", "スープ", "調味料", "だし",
]);
function isFoodKeyword(keyword){
  return FOOD_KEYWORDS.some(w => keyword.includes(w));
}

// AIが使えないときの簡易フォールバック用のスペック項目（食品向けの3項目に固定）
const FALLBACK_SPEC_FIELDS = [
  { id: "qty", label: "容量" },
  { id: "packaging", label: "容器" },
  { id: "ingredients", label: "原材料" },
];

function fallbackAttrDefs(keyword){
  const hit = FALLBACK_GENRE_MAP.find(g => g.match.some(m => keyword.includes(m)));
  const ids = hit ? hit.attrs : FALLBACK_DEFAULT_ATTRS;
  return ids.map((id, i) => ({ id, label: FALLBACK_ATTRS[id].label, defaultChecked: i === 0 }));
}
function matchesWords(text, words){ return words.some(w => text.includes(w)); }

// ===== 商品テキストからの情報抽出（AIの結果が空のときの補完にも使う） =====
const PACKAGING_TYPES = [
  { label: "瓶", words: ["ガラス瓶", "瓶入り", "びん入り", "瓶"] },
  { label: "パウチ", words: ["パウチ", "スタンドパウチ", "袋入り"] },
  { label: "缶", words: ["缶入り", "缶詰", "缶"] },
  { label: "ペットボトル", words: ["ペットボトル", "PET"] },
  { label: "箱", words: ["化粧箱", "箱入り", "BOX", "ボックス"] },
  { label: "パック", words: ["パック"] },
];
function detectPackaging(text){
  const hit = PACKAGING_TYPES.find(p => matchesWords(text, p.words));
  return hit ? hit.label : "";
}
function detectIngredients(text){
  const m = text.match(/原材料[名]?[:：]?\s*([^\n。]{2,120})/);
  return m ? m[1].trim() : "";
}

// 楽天APIのpostageFlag（0:送料込み/送料無料表示、1:送料別）から送料表示を作る
function detectShipping(item){
  if(item.postageFlag === 0) return { free: true, label: "送料無料" };
  if(item.postageFlag === 1) return { free: false, label: "送料別" };
  return null;
}
// 楽天の画像URLは "?_ex=128x128" のようなパラメータでサイズが小さく指定されていることが多いので、
// 表示に使うため大きいサイズを要求し直す（画質自体はサーバー側の元画像次第だが、縮小し過ぎた画像よりは綺麗になる）
function upsizeImage(url){
  if(!url) return url;
  if(/_ex=\d+x\d+/.test(url)) return url.replace(/_ex=\d+x\d+/, "_ex=600x600");
  return url + (url.includes("?") ? "&" : "?") + "_ex=600x600";
}

// 楽天APIのレスポンスから商品画像URLを取り出す（バージョンによって形が微妙に違うため、いくつかの形に対応する）
function getImageUrl(item){
  const candidates = [item.mediumImageUrls, item.smallImageUrls];
  for(const arr of candidates){
    if(Array.isArray(arr) && arr.length > 0){
      const first = arr[0];
      const url = typeof first === "string" ? first : (first && first.imageUrl);
      if(url) return upsizeImage(url.replace(/^http:\/\//, "https://"));
    }
  }
  if(typeof item.imageUrl === "string" && item.imageUrl) return upsizeImage(item.imageUrl.replace(/^http:\/\//, "https://"));
  return "";
}

// AIが使えないときの簡易な商品名圧縮（先頭の「本体名」らしき部分だけ残す）
function compactName(name){
  if(!name) return "";
  // 【】や[]で囲まれた煽り文句、記号区切り以降の羅列を切り落とす
  let s = name.replace(/【[^】]*】/g, "").trim();
  const cutPoints = [" ", "　", "／", "/", "|", "｜"];
  let cutIndex = -1;
  for(const c of cutPoints){
    const i = s.indexOf(c, 8); // 先頭8文字より後ろで最初に見つかった区切りで切る
    if(i > 0 && (cutIndex === -1 || i < cutIndex)) cutIndex = i;
  }
  if(cutIndex > 0) s = s.slice(0, cutIndex);
  if(s.length > 30) s = s.slice(0, 30) + "…";
  return s || name.slice(0, 30);
}

function detectQuantity(text){
  if(!text) return null;
  let m = text.match(/(\d+(?:\.\d+)?)\s*m ?l/i);
  if(m) return { value: Number(m[1]), unit: "ml" };
  m = text.match(/(\d+(?:\.\d+)?)\s*[lL](?![a-zA-Z])/);
  if(m) return { value: Number(m[1]) * 1000, unit: "ml" };
  m = text.match(/(\d+(?:\.\d+)?)\s*kg/i);
  if(m) return { value: Number(m[1]) * 1000, unit: "g" };
  m = text.match(/(\d+(?:\.\d+)?)\s*g(?![a-zA-Z])/i);
  if(m) return { value: Number(m[1]), unit: "g" };
  // 重量・体積の記載が無い商品（海苔の枚数など）は、個数単位でも単価比較できるようにする
  m = text.match(/(\d+(?:\.\d+)?)\s*枚/);
  if(m) return { value: Number(m[1]), unit: "枚" };
  m = text.match(/(\d+(?:\.\d+)?)\s*個/);
  if(m) return { value: Number(m[1]), unit: "個" };
  m = text.match(/(\d+(?:\.\d+)?)\s*本/);
  if(m) return { value: Number(m[1]), unit: "本" };
  m = text.match(/(\d+(?:\.\d+)?)\s*袋/);
  if(m) return { value: Number(m[1]), unit: "袋" };
  m = text.match(/(\d+(?:\.\d+)?)\s*玉/);
  if(m) return { value: Number(m[1]), unit: "玉" };
  return null;
}

// ===== 好みプロフィール欄の描画 =====
function renderPrefPanel(attrDefs){
  currentAttrDefs = attrDefs;
  prefsContainer.innerHTML = attrDefs.map(a => {
    const checked = a.defaultChecked ? "checked" : "";
    return `<label class="filter-item"><input type="checkbox" id="pref_${a.id}" ${checked}> ${a.label}</label>`;
  }).join("");
  // チェックボックスを切り替えたら、その場でスコアを再計算して並び替え直す
  attrDefs.forEach(a => {
    const cb = document.getElementById(`pref_${a.id}`);
    if(cb) cb.addEventListener("change", onPrefChange);
  });
}

function onPrefChange(){
  if(currentRows.length === 0) return;
  computeScores(currentRows, currentAttrDefs);
  sortAndRender();
}

// ===== 「訳あり品を除外する」欄の描画（実際に訳あり品が混ざっているときだけ表示する） =====
function renderExcludePanel(rows){
  const hasWakeari = rows.some(r => r.wakeari);
  if(!hasWakeari){
    excludeContainer.innerHTML = "";
    excludeWakeari = false;
    return;
  }
  excludeContainer.innerHTML = `<label class="filter-item"><input type="checkbox" id="excludeWakeariCb" ${excludeWakeari ? "checked" : ""}> 訳あり品を除外する</label>`;
  const cb = document.getElementById("excludeWakeariCb");
  cb.addEventListener("change", () => {
    excludeWakeari = cb.checked;
    sortAndRender();
  });
}

// ===== 「賢い選び方」パネルの描画（型番・特定商品の検索と判定されたときだけ表示） =====
function renderBuyingGuide(guide){
  const hasContent = guide && (
    guide.cheapestTip ||
    (guide.checkpoints && guide.checkpoints.length) ||
    (guide.glossary && guide.glossary.length)
  );
  if(!hasContent){
    buyingGuidePanel.style.display = "none";
    buyingGuidePanel.innerHTML = "";
    return;
  }
  const tipHtml = guide.cheapestTip ? `<p class="bg-tip">💡 ${guide.cheapestTip}</p>` : "";
  const checkpointsHtml = (guide.checkpoints || [])
    .filter(c => c.label)
    .map(c => `<li><b>${c.label}</b>${c.note ? ` — ${c.note}` : ""}</li>`)
    .join("");
  const glossaryHtml = (guide.glossary || [])
    .filter(g => g.term)
    .map(g => `<dt>${g.term}</dt><dd>${g.explanation || ""}</dd>`)
    .join("");
  buyingGuidePanel.innerHTML = `
    <p class="bg-heading">この商品を賢く選ぶには</p>
    ${tipHtml}
    <div class="bg-columns">
      ${checkpointsHtml ? `<div class="bg-col"><h3>チェックポイント</h3><ul>${checkpointsHtml}</ul></div>` : ""}
      ${glossaryHtml ? `<div class="bg-col"><h3>用語ミニ解説</h3><dl>${glossaryHtml}</dl></div>` : ""}
    </div>
  `;
  buyingGuidePanel.style.display = "block";
}

// ===== 商品データの組み立て（AI結果あり／なし共通） =====
// specFieldDefs: [{id,label}] ジャンルに応じた客観スペック項目（AIが生成、またはFALLBACK_SPEC_FIELDS）
function buildRows(keyword, items, attrDefs, specFieldDefs, aiItemsByIndex, ignoreRelevance){
  const rows = [];
  let excluded = 0;
  const isFood = isFoodKeyword(keyword);

  items.forEach((it, idx) => {
    const item = it.Item || it; // APIバージョンによりItemでラップされる場合がある
    const text = `${item.itemName || ""} ${item.itemCaption || ""}`;
    const ai = aiItemsByIndex ? aiItemsByIndex.get(idx) : null;

    if(!ignoreRelevance && ai && ai.relevant === false){
      excluded++;
      return;
    }

    let qty = null, displayName = "", origin = "", maker = "", feature = "";
    const specValues = {};
    const attrHits = {};

    if(ai){
      displayName = ai.shortName || compactName(item.itemName);
      origin = isFood ? (ai.origin || detectOrigin(text)) : "";
      maker = ai.maker || "";
      feature = ai.feature || "";
      const specMap = new Map((ai.specs || []).map(s => [s.id, s.value]));
      specFieldDefs.forEach(f => { specValues[f.id] = specMap.get(f.id) || ""; });
      // 単価計算は、画面にそのまま表示する「容量」欄のテキストから直接抽出する。
      // AIが単価計算専用に別枠で返す数値を使うと、表示は「50枚」なのに単価だけ謎のg換算になる、
      // といった表示と計算の食い違いが起きるため、常に同じ数値から両方を出す。
      qty = detectQuantity(specValues.qty) || detectQuantity(text);
      const hitMap = new Map((ai.attrHits || []).map(h => [h.id, !!h.hit]));
      attrDefs.forEach(a => { if(a.id !== "cost") attrHits[a.id] = hitMap.get(a.id) || false; });
    }else{
      qty = detectQuantity(text);
      displayName = compactName(item.itemName);
      origin = isFood ? detectOrigin(text) : "";
      // フォールバック時はFALLBACK_SPEC_FIELDSのidに合わせて簡易抽出する
      specFieldDefs.forEach(f => {
        if(f.id === "qty") specValues.qty = qty ? `${qty.value}${qty.unit}` : "";
        else if(f.id === "packaging") specValues.packaging = detectPackaging(text);
        else if(f.id === "ingredients") specValues.ingredients = detectIngredients(text);
        else specValues[f.id] = "";
      });
      attrDefs.forEach(a => {
        if(a.id === "cost") return;
        const words = (FALLBACK_ATTRS[a.id] && FALLBACK_ATTRS[a.id].words) || [];
        attrHits[a.id] = matchesWords(text, words);
      });
    }

    // 「訳あり」はAIの判定やジャンル判定に頼らず、ジャンルを問わず常にキーワード検出で確実に判定する
    const wakeari = matchesWords(text, WAKEARI_WORDS);

    const perUnit = qty ? item.itemPrice / qty.value : null;

    rows.push({
      name: item.itemName,
      displayName, origin, maker, feature,
      image: getImageUrl(item),
      url: item.itemUrl,
      shop: item.shopName,
      mall: item._mall || "楽天",
      price: item.itemPrice,
      shipping: detectShipping(item),
      qty, perUnit,
      specValues, attrHits, wakeari,
      rating: item.reviewAverage || null,
      reviews: item.reviewCount || 0,
    });
  });

  return { rows, excluded };
}

// 同じ商品が別の店舗から重複して出てくることがあるため、まとめる。
// 画像URLは店舗ごとに違う写真を使っていることが多く一致しないので、
// 「商品名（要約後）＋価格＋容量」が一致するものを同一商品とみなす。
// まとめる際は、片方に欠けている情報（スペック項目・画像など）をもう片方から補う。
function mergeRowInfo(base, other){
  const merged = { ...base };
  merged.specValues = { ...(other.specValues || {}), ...(base.specValues || {}) };
  Object.keys(other.specValues || {}).forEach(k => {
    if(!merged.specValues[k] && other.specValues[k]) merged.specValues[k] = other.specValues[k];
  });
  if(!merged.origin && other.origin) merged.origin = other.origin;
  if(!merged.maker && other.maker) merged.maker = other.maker;
  if(!merged.feature && other.feature) merged.feature = other.feature;
  if(!merged.shipping && other.shipping) merged.shipping = other.shipping;
  if(!merged.qty && other.qty) merged.qty = other.qty;
  if(!merged.perUnit && other.perUnit) merged.perUnit = other.perUnit;
  if(!merged.image && other.image) merged.image = other.image;
  if((merged.rating === null || merged.rating === undefined) && other.rating != null) merged.rating = other.rating;
  if(!merged.reviews && other.reviews) merged.reviews = other.reviews;
  merged.wakeari = !!(base.wakeari || other.wakeari); // どちらかで訳あり検出されていれば訳ありとみなす
  merged.attrHits = { ...other.attrHits, ...base.attrHits };
  // どちらかで検出されていればOKとする（陽性シグナルを優先）
  Object.keys(other.attrHits || {}).forEach(k => {
    if(other.attrHits[k] && !merged.attrHits[k]) merged.attrHits[k] = true;
  });
  return merged;
}

function dedupeRows(rows){
  const seen = new Map();
  const kept = [];
  let duplicates = 0;

  rows.forEach(r => {
    const normName = (r.displayName || r.name || "").replace(/[\s　・、,／\/【】()（）]/g, "");
    const key = `${normName}|${r.price}|${r.qty ? r.qty.value + r.qty.unit : ""}`;

    if(seen.has(key)){
      duplicates++;
      const existingIdx = seen.get(key);
      const existing = kept[existingIdx];
      // 口コミ件数が多い方（＝より実績があり信頼できそうな方）を代表として残しつつ、
      // 足りない項目はもう片方から補う
      const primary = (r.reviews || 0) > (existing.reviews || 0) ? r : existing;
      const secondary = primary === r ? existing : r;
      kept[existingIdx] = mergeRowInfo(primary, secondary);
    }else{
      seen.set(key, kept.length);
      kept.push(r);
    }
  });

  return { rows: kept, duplicates };
}

function computeScores(rows, attrDefs){
  const knownPerUnit = rows.map(r => r.perUnit).filter(v => v !== null && v !== undefined);
  const maxPerUnit = Math.max(...knownPerUnit, 1);
  const minPerUnit = Math.min(...knownPerUnit, 0);

  rows.forEach(r => {
    let costScore = 0.5;
    if(r.perUnit !== null && maxPerUnit > minPerUnit){
      costScore = 1 - (r.perUnit - minPerUnit) / (maxPerUnit - minPerUnit);
    }
    let score = 0;
    let weightSum = 0;
    attrDefs.forEach(a => {
      const cb = document.getElementById(`pref_${a.id}`);
      if(!cb || !cb.checked) return;
      weightSum += 1;
      if(a.id === "cost"){ score += costScore; }
      else { score += (r.attrHits[a.id] ? 1 : 0.3); }
    });
    r.score = weightSum ? score / weightSum : costScore;
  });
}

function fmtYen(n){ return "¥" + Number(n).toLocaleString("ja-JP"); }

function renderCards(rows, excludedInfo){
  const { relevance = 0, duplicates = 0, wakeari = 0 } = excludedInfo || {};
  const notes = [];
  if(relevance) notes.push(`関連性が低いと判定された${relevance}件`);
  if(duplicates) notes.push(`重複していた${duplicates}件`);
  if(wakeari) notes.push(`訳あり品${wakeari}件`);
  resultCountEl.textContent = notes.length
    ? `${rows.length}件（${notes.join("、")}を除外）`
    : `${rows.length}件`;

  cardsEl.innerHTML = rows.map(r => {
    const perUnitValue = r.perUnit ? `${r.perUnit.toFixed(2)}円/${r.qty.unit}` : "";
    // 容量（qty）は値段の下にセットで表示するので、その他のスペック一覧からは重複を避けて除く
    const qtyDisplay = (r.specValues || {}).qty || "";
    const specsLine = currentSpecFields
      .filter(f => f.id !== "qty")
      .map(f => {
        const val = (r.specValues || {})[f.id] || "";
        return val ? `<span><b>${f.label}</b> ${val}</span>` : "";
      })
      .filter(Boolean)
      .join("");
    // 該当しない属性は「×」で否定的に見せず、そもそも表示しない（該当するものだけをタグのように示す）
    const attrsLine = currentAttrDefs
      .filter(a => a.id !== "cost")
      .filter(a => r.attrHits[a.id])
      .map(a => `<span class="hit">○ ${a.label}</span>`)
      .join("");

    const metaBits = [];
    if(r.origin) metaBits.push(`<span class="origin">${r.origin}</span>`);
    if(r.maker) metaBits.push(r.maker);

    const thumb = r.image
      ? `<a class="p-thumb" href="${r.url}" target="_blank" rel="noopener"><img src="${r.image}" alt="" loading="lazy" onerror="this.closest('.p-thumb').outerHTML='&lt;div class=&quot;p-thumb empty&quot;&gt;画像なし&lt;/div&gt;'"></a>`
      : `<div class="p-thumb empty">画像なし</div>`;

    return `
    <li class="product-row">
      ${thumb}
      <div class="p-info">
        <div class="p-name"><a href="${r.url}" target="_blank" rel="noopener" title="${r.name.replace(/"/g, '&quot;')}">${r.displayName || r.name}</a></div>
        ${metaBits.length ? `<div class="p-meta">${metaBits.join(" ")}</div>` : ""}
        ${r.feature ? `<div class="p-feature">${r.feature}</div>` : ""}
        ${specsLine ? `<div class="p-specs">${specsLine}</div>` : ""}
        ${attrsLine ? `<div class="p-attrs">${attrsLine}</div>` : ""}
        <div class="p-shop">${r.mall ? `<span class="p-mall">${r.mall}</span> ` : ""}販売: ${r.shop}</div>
      </div>
      <div class="p-side">
        ${r.isCheapest ? `<span class="badge-cheapest">最安値</span>` : ""}
        <div class="p-price">${fmtYen(r.price)}</div>
        ${qtyDisplay ? `<div class="p-qty">${qtyDisplay}</div>` : ""}
        ${perUnitValue ? `<div class="p-perunit">${perUnitValue}</div>` : ""}
        <div class="p-shipping ${r.shipping && r.shipping.free ? "free" : ""}">${r.shipping ? r.shipping.label : ""}</div>
        <div class="p-rating">${r.rating ? `★${r.rating}` : "評価なし"}${r.reviews ? ` <span class="count">(${r.reviews})</span>` : ""}</div>
      </div>
    </li>
    `;
  }).join("");
}

function sortAndRender(){
  const key = sortSelect.value;
  const wakeariExcludedCount = excludeWakeari ? currentRows.filter(r => r.wakeari).length : 0;
  const base = excludeWakeari ? currentRows.filter(r => !r.wakeari) : currentRows;
  const rows = [...base].sort((a,b) => {
    if(key === "price") return a.price - b.price;
    if(key === "rating") return (b.rating||0) - (a.rating||0);
    if(key === "perunit") return (a.perUnit ?? Infinity) - (b.perUnit ?? Infinity);
    return (b.score||0) - (a.score||0);
  });
  const info = { ...(sortAndRender.excludedInfo || {}), wakeari: wakeariExcludedCount };
  renderCards(rows, info);
}
sortSelect.addEventListener("change", sortAndRender);

async function runSearch(){
  const keyword = document.getElementById("q").value.trim();
  if(!keyword){ return; }
  document.body.classList.remove("home");
  goBtn.disabled = true;
  setButtonSearching();
  statusEl.className = "status";
  statusEl.textContent = "検索中…";
  resultPanel.style.display = "none";
  prefsContainer.innerHTML = `<p class="empty-note">分析中…</p>`;
  excludeContainer.innerHTML = "";
  buyingGuidePanel.style.display = "none";
  buyingGuidePanel.innerHTML = "";
  startLoadingScene();
  startProgress();

  try{
    // 楽天とYahoo!ショッピングを並行して検索する。Yahoo!側が失敗しても、楽天の結果だけで続行できるようにする。
    let yahooFailed = false;
    const [rakutenData, yahooItems] = await Promise.all([
      apiRequest("/api/search", { keyword, hits: 30 }),
      apiRequest("/api/searchYahoo", { keyword, hits: 30 })
        .then(d => (d.hits || []).map(yahooHitToItem))
        .catch(() => { yahooFailed = true; return []; }),
    ]);
    const rakutenItems = (rakutenData.Items || []).map(it => {
      const item = it.Item || it;
      item._mall = "楽天";
      return item;
    });
    // 楽天・Yahoo!を交互に並べておく（後段でAIに渡す件数を絞っても、どちらかのモールだけ
    // AI分析から漏れてしまう、という偏りが出ないようにするため）
    const items = [];
    const maxLen = Math.max(rakutenItems.length, yahooItems.length);
    for(let i = 0; i < maxLen; i++){
      if(rakutenItems[i]) items.push(rakutenItems[i]);
      if(yahooItems[i]) items.push(yahooItems[i]);
    }
    if(items.length === 0){
      statusEl.textContent = "商品が見つかりませんでした。";
      prefsContainer.innerHTML = `<p class="empty-note">検索すると表示されます</p>`;
      hideLoadingScene();
      setButtonIdle();
      return;
    }

    // AIへ一度に渡す件数が多いほど分析に時間がかかるため、上限を設けて速度を優先する。
    // 上限を超えた分は、AIによる整形（短い商品名や関連性判定など）は無いまま簡易表示になる。
    const AI_ANALYZE_LIMIT = 30;
    const itemsForAI = items.slice(0, AI_ANALYZE_LIMIT).map((item, index) => ({
      index,
      name: item.itemName || "",
      caption: (item.itemCaption || "").slice(0, 300),
    }));

    // 「訳あり」は独立した除外専用チェックとして扱うため、AIが同じ概念の属性を別idで生成しても
    // 好みプロフィール（attrDefs）には含めない（重複除外）
    const isWakeariLike = a => a.id === "wakeari" || /訳あり|わけあり|ワケあり/.test(a.label || "");

    let attrDefs, specFieldDefs, aiItemsByIndex, aiFailed = false, aiErrorMessage = "";
    let specificProduct = false, buyingGuide = null;
    try{
      const ai = await analyzeWithAI(keyword, itemsForAI);
      const aiAttrs = (ai.attributes || []).filter(a => a.id && a.id !== "cost" && !isWakeariLike(a)).slice(0, 4);
      attrDefs = [
        { id: "cost", label: "コスパ重視（単価が安い順を優先）", defaultChecked: true },
        ...aiAttrs.map((a, i) => ({ id: a.id, label: a.label, defaultChecked: i === 0 })),
      ];
      const aiSpecFields = (ai.specFields || []).filter(f => f.id && f.label).slice(0, 3);
      specFieldDefs = aiSpecFields.length ? aiSpecFields : FALLBACK_SPEC_FIELDS;
      aiItemsByIndex = new Map((ai.items || []).map(r => [r.index, r]));
      // 型番・特定商品の検索に見えるときだけ、「最安値はここ」表示と賢い選び方ガイドを出す
      specificProduct = !!ai.specificProduct;
      buyingGuide = ai.buyingGuide || null;
    }catch(e){
      aiFailed = true;
      aiErrorMessage = e.message;
      attrDefs = [
        { id: "cost", label: "コスパ重視（単価が安い順を優先）", defaultChecked: true },
        ...fallbackAttrDefs(keyword).filter(a => !isWakeariLike(a)),
      ];
      specFieldDefs = FALLBACK_SPEC_FIELDS;
      aiItemsByIndex = null;
    }

    currentSpecFields = specFieldDefs;
    currentSpecificProduct = specificProduct;
    renderPrefPanel(attrDefs);
    renderBuyingGuide(specificProduct ? buyingGuide : null);

    let relevanceIgnored = false;
    let built = buildRows(keyword, items, attrDefs, specFieldDefs, aiItemsByIndex);
    // AIが全件（またはほぼ全件）を「無関係」と判定した場合は、判定ミスの可能性が高いとみなし、
    // 関連性フィルタだけ無効にして出し直す（0件のまま検索結果が消えてしまうのを防ぐ）
    if(aiItemsByIndex && items.length > 0 && built.rows.length === 0){
      relevanceIgnored = true;
      built = buildRows(keyword, items, attrDefs, specFieldDefs, aiItemsByIndex, true);
    }
    const { rows: builtRows, excluded } = built;
    const { rows, duplicates } = dedupeRows(builtRows);
    computeScores(rows, attrDefs);
    // 型番・特定商品の検索のときは、一番安い1件に「最安値」バッジを付け、値段順を初期表示にする
    if(specificProduct && rows.length){
      const minPrice = Math.min(...rows.map(r => r.price));
      rows.forEach(r => { r.isCheapest = r.price === minPrice; });
      sortSelect.value = "price";
    }else{
      rows.forEach(r => { r.isCheapest = false; });
    }
    currentRows = rows;
    renderExcludePanel(rows);
    sortAndRender.excludedInfo = { relevance: relevanceIgnored ? 0 : excluded, duplicates };
    sortAndRender();
    hideLoadingScene();
    resultPanel.style.display = "block";
    setButtonSuccess();

    const yahooNote = yahooFailed ? "（Yahoo!ショッピングの検索は今回取得できませんでした）" : "";
    statusEl.textContent = (aiFailed
      ? `${rows.length}件取得しました。（AI分析が利用できなかったため簡易判定を使用しています / 詳細: ${aiErrorMessage}）`
      : relevanceIgnored
      ? `${rows.length}件取得しました。（AIが全件を無関係と判定したため、関連性の判定は今回無効にしています）`
      : `${items.length}件取得しました。`) + yahooNote;
  }catch(e){
    statusEl.className = "status err";
    statusEl.textContent = "エラー: " + e.message;
    prefsContainer.innerHTML = `<p class="empty-note">検索すると表示されます</p>`;
    hideLoadingScene();
    setButtonIdle();
  }finally{
    goBtn.disabled = false;
    finishProgress();
  }
}

goBtn.addEventListener("click", runSearch);
document.getElementById("q").addEventListener("keydown", e => { if(e.key === "Enter") runSearch(); });
</script>
